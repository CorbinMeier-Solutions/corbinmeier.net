# standard: wrangler-config@2026-10-16
name = "corbinmeier-net"
compatibility_date = "2026-09-26"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Plain variables only. Secrets: npx wrangler pages secret put <NAME> --project-name corbinmeier-net
# (production AND preview). Environments do NOT inherit [vars]: [env.preview.vars]
# added 2026-11-01
SITE_URL = "https://corbinmeier.net"
# repeats every variable. Each variable carries the date it was added on the line above.
[vars]
# added 2026-11-01
SITE_URL = "https://corbinmeier.net"
# added 2026-09-26
CLOUDFLARE_ACCOUNT_ID = "56cc31643fbd29d5b3fe4da66d5323c3"
# added 2026-09-26
MAIL_FROM = "Corbin Meier <contact@send.corbinmeier.net>"
# renamed 2026-09-26 from PERSONAL_EMAIL
FORM_TO_ADDRESSES = "corbinmeier.solutions@gmail.com"
# added 2026-09-26
BUSINESS_TIMEZONE = "America/Los_Angeles"
# added 2026-11-01
KEY_ALERT_GITHUB_REPO = "CorbinMeier-Solutions/corbinmeier.net"

