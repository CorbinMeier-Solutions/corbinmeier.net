<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corbin Meier | Software Engineer</title>
    <meta name="description" content="Software Engineer specializing in building sophisticated, high-performance applications." />
    <link rel="canonical" href="https://corbinmeier.net/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Corbin Meier | Software Engineer" />
    <meta property="og:description" content="Software Engineer specializing in building sophisticated, high-performance applications." />
    <meta property="og:url" content="https://corbinmeier.net/" />
    <meta property="og:image" content="https://corbinmeier.net/corbin.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Corbin Meier | Software Engineer" />
    <meta name="twitter:description" content="Software Engineer specializing in building sophisticated, high-performance applications." />
    <meta name="twitter:image" content="https://corbinmeier.net/corbin.jpg" />

    <!-- Fonts are self-hosted; see src/main.tsx. Nothing here may reference a
         third-party font host, which would put a request to it ahead of any
         consent the visitor has given. -->
    <script>
      // Pre-hydration FOUC guard: set the live theme CSS custom properties
      // directly (inline style beats any stylesheet rule, layered or not)
      // so the first paint already matches the route's page. Mirrors the
      // palette in src/lib/theme.ts - keep both in sync if it changes.
      (function () {
        var THEMES = {
          blue: { accent: "#3b82f6", background: "#0a0e17", cardBg: "#0d1420", border: "#1e2836", inputBg: "#0d1420" },
          green: { accent: "#10b981", background: "#04100c", cardBg: "#071712", border: "#0d2a21", inputBg: "#051a14" },
          red: { accent: "#ef4444", background: "#100404", cardBg: "#170707", border: "#2c0d0d", inputBg: "#1c0a0a" },
          yellow: { accent: "#eab308", background: "#120d02", cardBg: "#1a1305", border: "#2e2308", inputBg: "#1a1305" },
        };
        var path = window.location.pathname;
        var name = "blue";
        if (path.indexOf("/projects") === 0) name = "green";
        else if (path.indexOf("/tools") === 0) name = "yellow";
        else if (path.indexOf("/about") === 0) name = "red";
        else if (path.indexOf("/contact") === 0) name = "contact";

        var palette = THEMES[name === "contact" ? "blue" : name];
        var root = document.documentElement;
        root.style.setProperty("--accent", palette.accent);
        var v = parseInt(palette.accent.slice(1), 16);
        root.style.setProperty("--accent-rgb", ((v >> 16) & 255) + ", " + ((v >> 8) & 255) + ", " + (v & 255));
        root.style.setProperty("--background", palette.background);
        root.style.setProperty("--card-bg", palette.cardBg);
        root.style.setProperty("--border", palette.border);
        root.style.setProperty("--input-bg", palette.inputBg);
        if (name === "contact") root.classList.add("theme-contact");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
